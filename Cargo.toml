[workspace]
resolver = "3"
members = [
    "crates/stevedore-secrets",
    "crates/stevedore-secrets-cli",
    "crates/stevedore-secrets-mcp",
]

# Shared metadata, dependency versions, and lints, inherited by every member
# crate via `field.workspace = true`.
[workspace.package]
# No shared `version`: each crate carries its own. Nothing is published yet —
# every crate is `publish = false` until the owner cuts a release.
edition = "2024"
# Clippy gates 70+ lints on this value, and leaving it unset makes it assume the
# current toolchain — so the lint set below drifts with every upgrade.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agpalindrome/stevedore"

[workspace.dependencies]
# The library's only runtime dependency for now: ergonomic error enums.
thiserror = "2"
# Reserved for the source/sink implementations and their on-disk formats.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Binary-only (the CLI): ergonomic error context and arg parsing.
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# Lints carry their real level here, not in CI: local verdict equals CI verdict,
# and `warn` genuinely means "advisory". Every member opts in with
# `[lints] workspace = true` — a member without it silently gets none of this.
[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style   = { level = "deny", priority = -1 }
unused              = { level = "deny", priority = -1 }
let_underscore      = { level = "deny", priority = -1 }
keyword_idents      = { level = "deny", priority = -1 }
refining_impl_trait = { level = "deny", priority = -1 }
rust_2018_idioms    = { level = "deny", priority = -1 }

# A secrets tool has no business writing `unsafe`, and `forbid` is the one level
# no `#[allow]` anywhere can re-enable.
unsafe_code                   = "forbid"
missing_debug_implementations = "deny"
unreachable_pub               = "deny"
unsafe_op_in_unsafe_fn        = "deny"
unfulfilled_lint_expectations = "deny"
trivial_casts                 = "deny"
trivial_numeric_casts         = "deny"
unused_qualifications         = "deny"
unused_lifetimes              = "deny"
unused_import_braces          = "deny"
macro_use_extern_crate        = "deny"
missing_docs                  = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "deny", priority = -1 }
perf        = { level = "deny", priority = -1 }
style       = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }
cargo       = { level = "deny", priority = -1 }
# restriction and nursery are never enabled as groups — cherry-picks only.

multiple_crate_versions = "allow"      # unactionable: transitive dependencies

# restriction — panic-freedom
unwrap_used        = "deny"
panic              = "deny"
panic_in_result_fn = "deny"
unwrap_in_result   = "deny"
todo               = "deny"
unimplemented      = "deny"
unreachable        = "deny"
indexing_slicing   = "deny"
get_unwrap         = "deny"
string_slice       = "deny"
exit               = "deny"

# restriction — suppression discipline
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

# restriction — unsafe
undocumented_unsafe_blocks    = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment    = "deny"
unnecessary_safety_doc        = "deny"

# restriction — debug / IO
dbg_macro        = "deny"
print_stdout     = "deny"
print_stderr     = "deny"
filetype_is_file = "deny"

# restriction — silent failure
let_underscore_must_use     = "deny"
unused_result_ok            = "deny"
map_err_ignore              = "deny"
assertions_on_result_states = "deny"

# restriction — footguns, numeric, tests
rc_mutex               = "deny"
mem_forget             = "deny"
iter_over_hash_type    = "deny"
float_cmp_const        = "deny"
lossy_float_literal    = "deny"
missing_assert_message = "deny"
redundant_test_prefix  = "deny"

# nursery cherry-picks
path_buf_push_overwrite    = "deny"
read_zero_byte_vec         = "deny"
fallible_impl_from         = "deny"
debug_assert_with_mut_call = "deny"
collection_is_never_read   = "deny"
needless_collect           = "deny"
or_fun_call                = "deny"
use_self                   = "deny"
equatable_if_let           = "deny"
trivial_regex              = "deny"

# Inert unless CI runs `cargo doc`; it does.
[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
